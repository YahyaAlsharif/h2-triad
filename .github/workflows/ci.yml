name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_CHANNEL: chromium
      PLAYWRIGHT_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            model/requirements*.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            scripts/phase4/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r model/requirements.txt -r backend/requirements.txt
          python -m pip check
          npm ci --prefix frontend
          npm ci --prefix scripts/phase4
      - name: Scientific and backend tests (no refitting)
        run: |
          python -m pytest model/tests -q
          python -m pytest backend -q
          python scripts/release/inference_smoke.py
          python scripts/release/verify_release.py
          npm test --prefix scripts/phase4
      - name: Frontend checks
        run: |
          npm run lint --prefix frontend
          npm run format:check --prefix frontend
          npm run build --prefix frontend
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: npm test --prefix frontend
      - name: Compose configuration
        run: docker compose config --quiet
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-diagnostics
          path: frontend/test-results/
          retention-days: 3
          if-no-files-found: ignore
